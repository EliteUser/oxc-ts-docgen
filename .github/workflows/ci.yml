name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/master'
    name: Verify (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.18.0
          - 24
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install pnpm
        run: npm install --global pnpm@11.9.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Release artifact check
        run: pnpm release:check

  vite-compatibility:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/master'
    name: Vite ${{ matrix.vite-version }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vite-version:
          - 6
          - 7
          - 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0

      - name: Install pnpm
        run: npm install --global pnpm@11.9.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Select Vite version
        run: pnpm --filter @synthfall/oxc-ts-docgen-vite add --save-dev vite@${{ matrix.vite-version }} --lockfile=false

      - name: Test Vite plugin
        run: pnpm exec vitest run packages/vite-plugin/tests

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    name: Version or publish packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          registry-url: https://registry.npmjs.org

      - name: Install pnpm
        run: npm install --global pnpm@11.9.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create release PR or publish
        uses: changesets/action@v1
        with:
          version: pnpm release:version
          publish: pnpm release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
