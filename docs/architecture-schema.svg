<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">oxc-ts-docgen architecture schema</title>
  <desc id="desc">Architecture diagram showing user code, Vite plugin with TS/JS and Vue script transforms, type registry, docgen core, OXC parser and resolver, TypeScript semantic fallback, and DocSchema output.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#344054"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#087443"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .band { fill: #ffffff; stroke: #d0d5dd; stroke-width: 1.4; }
      .box { rx: 12; ry: 12; stroke-width: 1.6; }
      .user { fill: #e9f4ff; stroke: #2e90fa; }
      .vite { fill: #fff4e5; stroke: #f79009; }
      .core { fill: #ecfdf3; stroke: #12b76a; }
      .semantic { fill: #f4f3ff; stroke: #7a5af8; }
      .schema { fill: #fef3f2; stroke: #f04438; }
      .neutral { fill: #f2f4f7; stroke: #667085; }
      .title { font: 700 30px Arial, sans-serif; fill: #101828; }
      .label { font: 700 18px Arial, sans-serif; fill: #101828; }
      .small { font: 400 14px Arial, sans-serif; fill: #344054; }
      .tiny { font: 400 12px Arial, sans-serif; fill: #475467; }
      .arrow { stroke: #344054; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .arrow-green { stroke: #087443; stroke-width: 2; fill: none; marker-end: url(#arrow-green); }
      .dash { stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1280" height="820"/>
  <text class="title" x="52" y="58">oxc-ts-docgen Architecture</text>
  <text class="small" x="52" y="86">Vite-first getDocs() transform for TS/JS and Vue script blocks, OXC syntax path, bounded TypeScript semantic fallback, stable DocSchema output.</text>

  <rect class="band" x="40" y="120" width="1200" height="170" rx="16"/>
  <text class="label" x="64" y="154">Application and Vite adapter</text>

  <rect class="box user" x="72" y="182" width="210" height="76"/>
  <text class="label" x="94" y="212">User source</text>
  <text class="small" x="94" y="237">generic, object, or batch target</text>

  <rect class="box vite" x="356" y="166" width="246" height="104"/>
  <text class="label" x="378" y="196">transformGetDocs</text>
  <text class="small" x="378" y="221">OXC parse and scope scan</text>
  <text class="small" x="378" y="244">TS/JS or Vue script block</text>

  <rect class="box vite" x="690" y="166" width="246" height="104"/>
  <text class="label" x="712" y="196">TypeRegistry</text>
  <text class="small" x="712" y="221">type index and schema cache</text>
  <text class="small" x="712" y="244">consumer and HMR tracking</text>

  <rect class="box schema" x="1012" y="182" width="180" height="76"/>
  <text class="label" x="1034" y="212">Output code</text>
  <text class="small" x="1034" y="237">JSON schema value</text>

  <path class="arrow" d="M282 220 H348"/>
  <path class="arrow" d="M602 218 H682"/>
  <path class="arrow" d="M936 218 H1004"/>

  <rect class="band" x="40" y="330" width="1200" height="280" rx="16"/>
  <text class="label" x="64" y="364">Core docgen engine</text>

  <rect class="box core" x="72" y="396" width="220" height="92"/>
  <text class="label" x="94" y="426">TypeResolver</text>
  <text class="small" x="94" y="451">parse cache</text>
  <text class="small" x="94" y="474">import/export resolution</text>

  <rect class="box core" x="344" y="396" width="226" height="92"/>
  <text class="label" x="366" y="426">ParsedSource index</text>
  <text class="small" x="366" y="451">declarations, imports, exports</text>
  <text class="small" x="366" y="474">comments and line starts</text>

  <rect class="box core" x="622" y="396" width="246" height="92"/>
  <text class="label" x="644" y="426">ResolutionController</text>
  <text class="small" x="644" y="451">static result classification</text>
  <text class="small" x="644" y="474">semantic fallback routing</text>

  <rect class="box core" x="920" y="386" width="244" height="112"/>
  <text class="label" x="942" y="416">Static builders</text>
  <text class="small" x="942" y="441">entry, property, enum</text>
  <text class="small" x="942" y="464">DocType construction</text>
  <text class="small" x="942" y="487">heritage and generics</text>

  <rect class="box neutral" x="186" y="526" width="254" height="54"/>
  <text class="label" x="208" y="560">ModuleResolver</text>
  <text class="tiny" x="208" y="576">oxc-resolver, tsconfig, paths</text>

  <rect class="box neutral" x="486" y="526" width="256" height="54"/>
  <text class="label" x="508" y="560">Related types</text>
  <text class="tiny" x="508" y="576">reference targets and schema.related</text>

  <rect class="box neutral" x="790" y="526" width="238" height="54"/>
  <text class="label" x="812" y="560">Dependency graph</text>
  <text class="tiny" x="812" y="576">schema files and cache invalidation</text>

  <path class="arrow-green" d="M812 270 V318 C812 348 760 358 745 388"/>
  <path class="arrow-green" d="M292 442 H336"/>
  <path class="arrow-green" d="M570 442 H614"/>
  <path class="arrow-green" d="M868 442 H912"/>
  <path class="arrow-green" d="M181 488 C190 512 220 525 252 536"/>
  <path class="arrow-green" d="M745 488 C716 512 677 524 640 536"/>
  <path class="arrow-green" d="M1042 498 C1035 524 1000 536 948 544"/>

  <rect class="band" x="40" y="650" width="1200" height="120" rx="16"/>
  <text class="label" x="64" y="684">Semantic fallback and final schema</text>

  <rect class="box semantic" x="128" y="704" width="256" height="46"/>
  <text class="label" x="150" y="733">TypeScriptSemanticService</text>

  <rect class="box semantic" x="480" y="704" width="294" height="46"/>
  <text class="label" x="502" y="733">TypeScriptSemanticFallbackResolver</text>

  <rect class="box schema" x="870" y="704" width="230" height="46"/>
  <text class="label" x="892" y="733">DocSchema v1</text>

  <path class="arrow dash" d="M746 488 C730 610 520 642 384 712"/>
  <path class="arrow dash" d="M384 727 H472"/>
  <path class="arrow" d="M774 727 H862"/>
  <path class="arrow" d="M985 704 C1000 640 1040 560 1042 500"/>

  <text class="tiny" x="52" y="802">Solid arrows are normal data flow. Dashed arrows are semantic fallback flow when static extraction reaches a TypeScript semantic boundary.</text>
</svg>
